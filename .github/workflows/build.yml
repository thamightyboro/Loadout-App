name: Build APK

# - Every push to main: test build (debug-signed APK as a workflow artifact).
# - Publishing a GitHub Release: proper release APK signed with the private key
#   (from repo secrets) and attached to that release for players to download.
# - Run workflow (manually) with a release tag: rebuilds that release's APK from the
#   current main and attaches it (e.g. if a release build failed).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and attach an APK to (e.g. v0.7.3). Leave empty for a test build."
        required: false
        default: ""
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # The fixed debug signing key is kept as text (debug.keystore.txt) so it can be
      # edited on github.com; turn it back into the binary key file before building.
      - name: Restore debug signing key
        run: base64 -d app/debug.keystore.txt > app/debug.keystore

      # Component averages/modifiers and the Space Duty vendor lists come straight from the
      # SWG-Source tables (pinned commit) and are turned into the app's components.json.
      - name: Get SWG-Source component tables
        uses: actions/checkout@v4
        with:
          repository: SWG-Source/dsrc
          ref: e3aac29b55b46fec2ce2b1518db80a8f70d798a5
          path: dsrc
          sparse-checkout: |
            sku.0/sys.server/compiled/game/datatables/ship/components
            sku.0/sys.server/compiled/game/datatables/item/vendor/space_duty

      - name: Build component reference data
        run: python3 tools/build_components.py dsrc app/src/main/assets/components.json

      # ---- Test builds (push to main) ----
      - name: Build debug APK
        if: env.RELEASE_TAG == ''
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: SWG-Loadouts-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Public releases ----
      - name: Build signed release APK
        if: env.RELEASE_TAG != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing - add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Pasting secrets can drag in invisible characters (non-breaking spaces, line
          # breaks, BOMs). The generated values are plain letters/digits and base64, so
          # strip anything else before use.
          PW=$(printf '%s' "$RELEASE_KEYSTORE_PASSWORD" | tr -cd 'A-Za-z0-9')
          KPW=$(printf '%s' "${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}" | tr -cd 'A-Za-z0-9')
          ALIAS=$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -cd 'A-Za-z0-9')
          echo "::add-mask::$PW"
          echo "::add-mask::$KPW"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The release key couldn't be opened - check RELEASE_KEYSTORE_BASE64 (the whole long line), RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS match github-secrets.txt."
            exit 1
          fi
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PASSWORD="$PW" RELEASE_KEY_PASSWORD="$KPW" RELEASE_KEY_ALIAS="$ALIAS"
          gradle :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach APK to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          cp app/build/outputs/apk/release/app-release.apk "SWG-Loadouts-$TAG.apk"
          gh release upload "$TAG" "SWG-Loadouts-$TAG.apk" --clobber --repo "${{ github.repository }}"
