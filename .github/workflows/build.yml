name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # The fixed debug signing key is kept as text (debug.keystore.txt) so it can be
      # edited on github.com; turn it back into the binary key file before building.
      - name: Restore signing key
        run: base64 -d app/debug.keystore.txt > app/debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SWG-Loadouts-apk
          path: app/build/outputs/apk/debug/app-debug.apk
